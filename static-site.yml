AWSTemplateFormatVersion: '2010-09-09'
Description: 'Part A.1: Secure Static Website with S3 and CloudFront OAC'

Parameters:
  StudentName:
    Type: String
    Default: 'Mahmoud Ben Azouz'
    Description: 'Student Name for resource tagging and site context'
  StudentLNumber:
    Type: String
    Default: 'L00123456'
    Description: 'Student L-Number'

Resources:
  # 1. Private S3 Bucket for Static Content
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'static-web-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Environment
          Value: Lab
        - Key: Owner
          Value: !Ref StudentName

  # 2. CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'OAC-${StudentLNumber}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # 3. CloudFront Distribution
  CDN:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        HttpVersion: http2and3

  # 4. S3 Bucket Policy allowing CloudFront OAC Access
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CDN.Id}'

Outputs:
  CloudFrontURL:
    Description: 'Public URL of the static website'
    Value: !Sub 'https://${CDN.DomainName}'
  S3BucketName:
    Description: 'Name of the deployment S3 bucket'
    Value: !Ref WebBucket